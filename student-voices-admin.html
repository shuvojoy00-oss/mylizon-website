<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Voices Admin | LizOn Education</title><style>
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#f5f7f5;color:#18372b}header{background:white;border-bottom:1px solid #dce5de;padding:15px max(20px,calc((100vw - 1080px)/2));display:flex;align-items:center;gap:14px}header img{width:42px}header a{margin-left:auto;color:#176342}main{max-width:1080px;margin:30px auto;padding:0 18px}h1{font-size:32px;margin-bottom:5px}p,small{color:#64736a}.panel{background:white;border:1px solid #dde7df;border-radius:16px;padding:23px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}input,select{width:100%;padding:12px;border:1px solid #cbd9d0;border-radius:8px;font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:11px 16px;background:#155b3d;color:white;font-weight:700}button.secondary{background:#e9f1eb;color:#174b35}button.danger{background:#a43d37}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.entry{border-top:1px solid #e5eae6;padding:14px 0;display:flex;align-items:center;gap:14px}.entry img{width:115px;aspect-ratio:16/9;object-fit:cover;border-radius:8px}.entry .details{flex:1;min-width:0}.entry strong{display:block;overflow-wrap:anywhere}.entry small{display:block;margin:5px 0}.category{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #e8ede9}.status{min-height:22px;color:#1a6847}.error{color:#a22d2d}[hidden]{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.entry{flex-wrap:wrap}.entry .actions{width:100%}header{padding:15px}}</style></head><body><header><img src="assets/logo/lizon-logo.png" alt="LizOn logo"><strong>LizOn Education Admin</strong><a href="admin-dashboard.html">Dashboard</a></header><main><h1>Student Voices</h1><p>Manage published student testimonials and categories. Changes appear on the homepage.</p>
<section class="panel" id="login-panel"><h2>Admin sign in</h2><div class="field"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password"></div><button id="login">Sign in</button><p id="login-message" class="status" role="status"></p></section>
<div id="manager" hidden><p id="status" class="status" role="status"></p><section class="panel"><h2 id="form-heading">Add student video</h2><form id="video-form"><div class="grid"><div class="field"><label for="title">Video title</label><input id="title" maxlength="180" required></div><div class="field"><label for="youtube">YouTube link</label><input id="youtube" type="url" required placeholder="https://youtu.be/..."></div><div class="field"><label for="category">Category</label><select id="category" required></select></div><div class="field"><label for="sort">Display order (smaller numbers first)</label><input id="sort" type="number" value="10"></div></div><div class="field"><label><input type="checkbox" id="published" checked style="width:auto"> Published</label></div><div class="actions"><button type="submit" id="save">Publish video</button><button type="button" id="cancel" class="secondary" hidden>Cancel editing</button></div></form></section>
<section class="panel"><h2>Published and unpublished videos</h2><p>Edit a published video without losing its existing record.</p><div id="videos"></div></section>
<section class="panel"><h2>Manage categories</h2><form id="category-form" class="actions"><input id="new-category" placeholder="New category name" maxlength="70" required style="flex:1;min-width:180px"><button type="submit">Add category</button></form><div id="categories"></div></section></div></main>
<script>
const $=id=>document.getElementById(id);let videos=[],categories=[],editing=null;
function say(s,error=false){$("status").textContent=s;$("status").classList.toggle("error",error)}
async function api(method="GET",body){const r=await fetch("/api/student-voices",{method,credentials:"same-origin",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Request failed");return d}
function option(cat){const o=document.createElement("option");o.value=cat.id;o.textContent=cat.name;return o}
async function refresh(){const d=await api();videos=d.videos;categories=d.categories;$("category").replaceChildren(...categories.map(option));render()}
function button(label,fn,cls="secondary"){const b=document.createElement("button");b.type="button";b.textContent=label;b.className=cls;b.onclick=fn;return b}
function reset(){$("video-form").reset();$("sort").value=videos.length+1;editing=null;$("form-heading").textContent="Add student video";$("save").textContent="Publish video";$("cancel").hidden=true}
function edit(v){editing=v.id;$("title").value=v.title;$("youtube").value=v.youtube_url;$("category").value=v.category_id;$("sort").value=v.sort_order;$("published").checked=v.published;$("form-heading").textContent="Edit student video";$("save").textContent="Save changes";$("cancel").hidden=false;window.scrollTo({top:0,behavior:"smooth"});$("title").focus()}
function render(){const list=$("videos");list.replaceChildren();for(const v of videos){const row=document.createElement("div");row.className="entry";const img=document.createElement("img");img.src="https://img.youtube.com/vi/"+v.video_id+"/hqdefault.jpg";img.alt="Video thumbnail";img.loading="lazy";const detail=document.createElement("div");detail.className="details";const title=document.createElement("strong");title.textContent=v.title;const info=document.createElement("small");info.textContent=v.category+" · "+(v.published?"Published":"Unpublished")+" · Order "+v.sort_order;detail.append(title,info);const actions=document.createElement("div");actions.className="actions";actions.append(button("Edit",()=>edit(v)),button(v.published?"Unpublish":"Publish",async()=>{try{await api("PATCH",{action:"video",...v,published:!v.published});await refresh();say("Publication status updated")}catch(e){say(e.message,true)}}),button("Delete",async()=>{if(!confirm("Delete this student video permanently?"))return;try{await api("DELETE",{action:"video",id:v.id});await refresh();say("Video deleted")}catch(e){say(e.message,true)}},"danger"));row.append(img,detail,actions);list.append(row)}if(!videos.length)list.textContent="No videos yet.";
const catList=$("categories");catList.replaceChildren();for(const c of categories){const row=document.createElement("div");row.className="category";const name=document.createElement("strong");name.textContent=c.name;const actions=document.createElement("div");actions.className="actions";actions.append(button("Rename",async()=>{const next=prompt("New category name",c.name);if(!next||!next.trim())return;try{await api("PATCH",{action:"category",id:c.id,name:next});await refresh();say("Category renamed")}catch(e){say(e.message,true)}}),button("Delete",async()=>{if(!confirm("Delete category "+c.name+"? Videos must be reassigned first."))return;try{await api("DELETE",{action:"category",id:c.id});await refresh();say("Category deleted")}catch(e){say(e.message,true)}},"danger"));row.append(name,actions);catList.append(row)}}
$("login").onclick=async()=>{try{const r=await fetch("/api/admin-login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});const d=await r.json();if(!d.ok)throw Error(d.error||"Login failed");$("password").value="";$("login-panel").hidden=true;$("manager").hidden=false;await refresh();reset()}catch(e){$("login-message").textContent=e.message}};
$("video-form").onsubmit=async e=>{e.preventDefault();try{const body={action:"video",title:$("title").value,youtube_url:$("youtube").value,category_id:Number($("category").value),sort_order:Number($("sort").value),published:$("published").checked};if(editing)body.id=editing;await api(editing?"PATCH":"POST",body);await refresh();reset();say("Video saved successfully")}catch(e){say(e.message,true)}};
$("category-form").onsubmit=async e=>{e.preventDefault();try{await api("POST",{action:"category",name:$("new-category").value});$("new-category").value="";await refresh();say("Category created")}catch(e){say(e.message,true)}};
$("cancel").onclick=reset;
</script></body></html>
