<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batch Manager | LizOn Education</title><style>body{font:15px system-ui;margin:0;background:#f5f8f5;color:#183529}header{background:#12372b;color:white;padding:22px}main{max-width:1100px;margin:auto;padding:22px}.layout{display:grid;grid-template-columns:280px 1fr;gap:20px}.panel{background:white;padding:22px;border-radius:16px;border:1px solid #d8e6dd}label{display:block;margin:13px 0 5px;font-weight:650}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #b8cdbf;border-radius:9px;font:inherit}textarea{min-height:90px}button{cursor:pointer;border:0;background:#176845;color:white;padding:11px 14px;border-radius:9px;margin:5px 4px 5px 0}button.alt{background:#e3eee6;color:#15452d}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list button{display:block;width:100%;text-align:left}small{color:#63766a}#notice{padding:10px;background:#edf8ee;border-radius:9px}a{color:#146f48}@media(max-width:760px){.layout,.two{grid-template-columns:1fr}main{padding:12px}}</style></head><body><header><h1>LizOn Batch Manager</h1><p>Manage public batch listings. Existing one-on-one courses are not affected.</p><a style="color:white" href="admin.html">Back to Portal Admin</a></header><main><p id="notice">Checking admin access…</p><div class="layout" id="layout" hidden><aside class="panel"><button id="new">Add New Batch</button><div class="list" id="list"></div></aside><section class="panel"><form id="form"><div class="two"><div><label>Batch ID (unique)</label><input name="id" required pattern="[a-z0-9-]+" placeholder="ielts-full"></div><div><label>Category</label><select name="category"><option value="ielts">IELTS</option><option value="pte">PTE</option></select></div></div><div class="two"><div><label>Course name</label><input name="name" required></div><div><label>Availability</label><select name="status"><option value="open">Open</option><option value="full">Batch Full</option><option value="hidden">Hidden</option></select></div></div><div class="two"><div><label>Fee (BDT)</label><input type="number" min="0" name="fee" required></div><div><label>Duration</label><input name="duration" required></div></div><div class="two"><div><label>Teacher</label><input name="teacher"></div><div><label>WhatsApp number</label><input name="whatsapp" pattern="01[0-9]{9}" required></div></div><div class="two"><div><label>Class days (comma separated)</label><input name="days"></div><div><label>Class time (24h)</label><input name="time" type="time"></div></div><div class="two"><div><label>First class</label><input name="start" type="date"></div><div><label>Class length (minutes)</label><input name="classMinutes" type="number" min="1"></div></div><div class="two"><div><label>Learning website access (months)</label><input name="websiteMonths" type="number" min="0"></div><div><label>Unlimited portal access (months)</label><input name="portalMonths" type="number" min="0"></div></div><label>Course description</label><textarea name="description"></textarea><label>Included benefits (one per line)</label><textarea name="benefits"></textarea><label>Continuation policy</label><textarea name="continuation"></textarea><label>Guided FAQ (JSON array of question-answer pairs)</label><textarea name="faq"></textarea><button type="submit">Save Batch</button><button class="alt" type="button" id="preview">Preview Course</button><button class="alt" type="button" id="remove">Delete Batch</button></form></section></div></main><script type="module" src="./assets/batch-manager.js"></script></body></html>
