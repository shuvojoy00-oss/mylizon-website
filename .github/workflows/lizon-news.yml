name: LizOn Daily News

on:
  workflow_dispatch:
    inputs:
      test_three_categories:
        description: "Publish and verify one Study Abroad, one IELTS and one PTE article immediately"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/lizon-news.yml"
  schedule:
    # Primary publication: 19:00 Asia/Dhaka (13:00 UTC).
    - cron: "0 13 * * *"
    # Recovery checks run off the hour to reduce scheduler congestion.
    # Recovery attempts check the database and retry missing articles.
    - cron: "15 13 * * *"
    - cron: "15 14 * * *"
    - cron: "15 15 * * *"
    - cron: "15 16 * * *"
    - cron: "15 17 * * *"

permissions:
  contents: read

concurrency:
  group: lizon-daily-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check News agent syntax
        run: node --check automation/news-agent.js

      - name: Log Bangladesh publishing time
        run: |
          echo "Bangladesh time: $(TZ=Asia/Dhaka date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "GitHub event: $GITHUB_EVENT_NAME"

      - name: Wait for production News endpoint
        run: |
          for i in {1..24}; do
            code="$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://www.mylizon.com/api/news-health || true)"
            if [ "$code" = "200" ]; then
              echo "News health endpoint is healthy with HTTP $code"
              exit 0
            fi
            sleep 5
          done
          echo "News health endpoint never returned HTTP 200 (database or deployment unavailable)"
          exit 1

      - name: Record test start time
        if: (github.event_name == 'push' || inputs.test_three_categories == true)
        run: echo "NEWS_TEST_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Research, write and publish
        env:
          NEWS_TEST_THREE_CATEGORIES: ${{ github.event_name == 'schedule' || inputs.test_three_categories == true }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_AUTOMATION_SECRET: ${{ secrets.NEWS_AUTOMATION_SECRET }}
          LIZON_BASE_URL: https://www.mylizon.com
          GEMINI_PRIMARY_MODEL: gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash
        run: node automation/news-agent.js


      - name: Verify Study Abroad, IELTS and PTE are all newly published
        if: (github.event_name == 'push' || inputs.test_three_categories == true) && success()
        run: |
          feed="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' 'https://www.mylizon.com/api/content?limit=10')"
          echo "$feed"
          echo "$feed" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              try {
                const j=JSON.parse(s);
                const start=Number(process.env.NEWS_TEST_STARTED_EPOCH||0)*1000;
                const required=["study-abroad","ielts","pte"];
                const posts=(j.posts||[]).filter(p=>new Date(p.published_at).getTime()>=start && p.ai_generated===true);
                const categories=[...new Set(posts.map(p=>p.category))];
                console.log("Newly published test articles:", JSON.stringify(posts.map(p=>({category:p.category,title:p.title_en,published_at:p.published_at}))));
                const missing=required.filter(c=>!categories.includes(c));
                if(!j.ok || missing.length) {
                  console.error("Missing newly published categories:",missing.join(", "));
                  process.exit(1);
                }
                console.log("PASS: one newly published article exists for each required category.");
              } catch(e) { console.error(e); process.exit(1); }
            });
          '

      - name: Verify article is published in production
        if: success()
        run: |
          for i in {1..12}; do
            result="$(curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' https://www.mylizon.com/api/news-health || true)"
            echo "Publication verification attempt $i: $result"
            if echo "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const j=JSON.parse(s);process.exit(j.ok && (process.env.GITHUB_EVENT_NAME === "schedule" ? j.all_three_published : j.published_today) ? 0 : 1)}catch{process.exit(1)}})'; then
              echo "Verified: all required scheduled categories exist in production database."
              exit 0
            fi
            sleep 10
          done
          echo "::error::No AI article found for today's Dhaka date after publishing attempt."
          exit 1
