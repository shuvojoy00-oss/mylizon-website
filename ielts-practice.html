<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Reading Practice | LizOn Education</title><link rel="stylesheet" href="css/ielts-practice.css"><script src="js/ielts-practice.js" defer></script></head><body><header><strong>LizOn Education <small>IELTS Reading Practice</small></strong><div><span id="clock" role="timer">60:00</span> <button id="submit" disabled>Submit test</button></div></header><main><section id="setup"><h1>Computer delivered Reading practice</h1><p>Original sample content. Not an official IELTS examination or Cambridge publication.</p><label>Choose mode <select id="mode"><option value="exam">Exam mode: 60 minute countdown and automatic submission</option><option value="practice">Practice mode: elapsed timer, no automatic submission</option></select></label><p><label>Sample test <select id="test-select"><option value="data/ielts-reading-sample.json">Original demonstration test</option></select></label></p><button id="start">Start or resume test</button> <button id="reset" type="button">Reset saved attempt</button><p id="load-error" role="alert"></p></section><section id="exam" hidden><div class="panes"><article id="passage" tabindex="0"><h2 id="passage-title"></h2><div id="passage-content"></div></article><div id="pane-divider" role="separator" aria-label="Resize reading and questions panels" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" tabindex="0" title="Drag to resize panels"><span class="divider-grip" aria-hidden="true"></span></div><div id="selection-toolbar" hidden role="toolbar" aria-label="Selected text actions"><button id="selection-highlight" type="button">Highlight</button><button id="selection-unhighlight" type="button">Remove highlight</button><button id="selection-note" type="button">Note</button><button id="selection-copy" type="button">Copy</button></div><aside id="questions" tabindex="0"><h2 id="question-heading">Questions</h2><div id="question-content"></div></aside></div><footer><nav id="passage-tabs" aria-label="Reading passage selection"></nav><p id="progress" aria-live="polite">0 of 40 answered</p><nav id="navigation" aria-label="Question navigation"></nav><div class="tools"><button id="highlight" type="button" title="Highlight selected passage text">Highlight</button><button id="clear-highlights" type="button" title="Remove all highlights from this passage">Clear highlights</button><button id="notes-toggle" type="button" aria-expanded="false">Notes</button><span id="reading-hint">Select text in the passage to highlight it.</span><div id="notes-panel" hidden><label for="notes">Passage notes</label><textarea id="notes" rows="3" placeholder="Your notes for this passage"></textarea></div></div></footer></section><section id="results" hidden aria-live="polite"></section></main></body></html>
