name: Sync IELTS Lesson Layout
on:
  workflow_dispatch:
  push:
    paths:
      - automation/sync-ielts-lesson-layout.py
      - .github/workflows/sync-ielts-lesson-layout.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate static IELTS pages from approved master
        run: python3 automation/sync-ielts-lesson-layout.py
      - name: Verify generated page structure
        run: python3 automation/ielts-library-audit.py
      - name: Commit page updates
        run: |
          git config user.name "LizOn Website Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'ielts-lesson-'*.html automation/ielts-layout-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync 71 IELTS pages with approved full lesson layout"
            git push origin HEAD:main
          fi
