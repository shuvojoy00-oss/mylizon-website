name: LizOn Daily News

on:
  workflow_dispatch:
  schedule:
    # Primary publication: 19:00 Asia/Dhaka (13:00 UTC).
    - cron: "0 13 * * *"
    # Recovery checks run off the hour to reduce scheduler congestion.
    # The agent skips immediately once an article is published after 19:00 Dhaka.
    - cron: "15 13 * * *"
    - cron: "15 14 * * *"
    - cron: "15 15 * * *"
    - cron: "15 16 * * *"
    - cron: "15 17 * * *"

permissions:
  contents: read

concurrency:
  group: lizon-daily-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check News agent syntax
        run: node --check automation/news-agent.js

      - name: Wait for production News endpoint
        run: |
          for i in {1..24}; do
            code="$(curl -s -o /dev/null -w "%{http_code}" https://www.mylizon.com/api/news-ingest || true)"
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then
              echo "News endpoint is reachable with HTTP $code"
              exit 0
            fi
            sleep 5
          done
          echo "News endpoint did not become reachable"
          exit 1

      - name: Research, write and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_AUTOMATION_SECRET: ${{ secrets.NEWS_AUTOMATION_SECRET }}
          LIZON_BASE_URL: https://www.mylizon.com
          GEMINI_PRIMARY_MODEL: gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash
        run: node automation/news-agent.js

      - name: Verify article is published in production
        if: success()
        run: |
          for i in {1..12}; do
            result="$(curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' https://www.mylizon.com/api/news-health || true)"
            echo "Publication verification attempt $i: $result"
            if echo "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const j=JSON.parse(s);process.exit(j.ok && (process.env.GITHUB_EVENT_NAME === \"schedule\" ? j.published_after_schedule : j.published_today) ? 0 : 1)}catch{process.exit(1)}})'; then
              echo "Verified: the required AI news article exists in production database."
              exit 0
            fi
            sleep 10
          done
          echo "::error::No AI article found for today's Dhaka date after publishing attempt."
          exit 1
