<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Insights Admin | LizOn Education</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/insights.css">
</head>
<body class="admin-body">
  <main class="admin-shell">
    <section id="login-card" class="admin-card login-card">
      <span class="eyebrow">LIZON CONTENT DESK</span>
      <h1>Sign in</h1>
      <input id="admin-password" type="password" placeholder="Admin password" autocomplete="current-password">
      <button id="login-btn" class="primary-btn">Continue</button>
      <p id="login-error" class="error"></p>
    </section>

    <section id="desk" hidden>
      <header class="desk-head">
        <div><span class="eyebrow">LIZON CONTENT DESK</span><h1>Publish without GitHub.</h1></div>
        <div class="desk-actions">
          <button id="run-ai" class="secondary-btn">Run AI News Check</button>
          <a href="insights.html" class="secondary-btn">View site</a>
        </div>
      </header>

      <div class="admin-grid">
        <form id="post-form" class="admin-card editor-card">
          <input type="hidden" id="post-id">
          <div class="field"><label>Bangla title</label><input id="title-bn" required></div>
          <div class="field"><label>English title</label><input id="title-en"></div>
          <div class="field"><label>Bangla short description</label><textarea id="excerpt-bn" rows="2"></textarea></div>
          <div class="field"><label>English short description</label><textarea id="excerpt-en" rows="2"></textarea></div>

          <div class="row-fields">
            <div class="field"><label>Category</label><select id="category"><option value="study-abroad">Study Abroad</option><option value="ielts">IELTS</option><option value="pte">PTE</option></select></div>
            <div class="field"><label>Type</label><select id="content-type"><option value="news">News</option><option value="guide">Guide</option><option value="suggestion">Suggestion</option><option value="prediction">Prediction</option><option value="announcement">Announcement</option></select></div>
          </div>

          <div class="field">
            <label>Bangla article</label>
            <div class="toolbar">
              <button type="button" data-cmd="bold"><b>B</b></button>
              <button type="button" data-cmd="italic"><i>I</i></button>
              <button type="button" data-block="h2">H2</button>
              <button type="button" data-block="h3">H3</button>
              <button type="button" data-cmd="insertUnorderedList">• List</button>
              <button type="button" data-cmd="insertOrderedList">1. List</button>
              <button type="button" data-link>Link</button>
            </div>
            <div id="body-bn" class="rich-editor" contenteditable="true"></div>
          </div>

          <div class="field">
            <label>English article</label>
            <div id="body-en" class="rich-editor" contenteditable="true"></div>
          </div>

          <div class="row-fields">
            <div class="field"><label>Source name</label><input id="source-name"></div>
            <div class="field"><label>Source URL</label><input id="source-url" type="url"></div>
          </div>

          <div class="row-fields">
            <div class="field"><label>Status</label><select id="status"><option value="draft">Draft</option><option value="review">Needs Review</option><option value="published">Published</option><option value="archived">Archived</option></select></div>
            <div class="field"><label>Importance</label><select id="importance"><option value="useful">Useful</option><option value="important">Important</option><option value="critical">Critical</option><option value="general">General</option></select></div>
          </div>

          <div class="check-row">
            <label><input id="featured-check" type="checkbox"> Featured</label>
            <label><input id="verified-check" type="checkbox"> Source verified</label>
          </div>

          <div class="form-actions">
            <button class="primary-btn" type="submit">Save post</button>
            <button id="new-post" class="secondary-btn" type="button">New</button>
          </div>
          <p id="save-message" class="save-message"></p>
        </form>

        <aside class="admin-card posts-card">
          <div class="posts-head"><h2>Posts</h2><button id="refresh-posts" class="text-btn">Refresh</button></div>
          <div id="admin-posts" class="admin-posts"></div>
        </aside>
      </div>
    </section>
  </main>
  <script src="js/admin-insights.js" defer></script>
</body>
</html>
